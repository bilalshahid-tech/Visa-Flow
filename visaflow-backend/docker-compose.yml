services:

  postgres:
    image: postgres:16-alpine
    container_name: visaflow-postgres
    environment:
      POSTGRES_DB: visaflow_db
      POSTGRES_USER: ${POSTGRES_USER:-visaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visaflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visaflow -d visaflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  visaflow-backend:
    build:
      context: ..
      dockerfile: visaflow-backend/Dockerfile
    container_name: visaflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/visaflow_db
      POSTGRES_USER: ${POSTGRES_USER:-visaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visaflow}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: visaflow-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-visaflow}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-visaflow123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  minio_data:
